<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#114B9F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VC Ops">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Vintage Cool — Operation and Sales Management</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f6f9fc; --card:#ffffff; --ink:#0d1b2e; --sub:#5a6b80;
    --brand:#114B9F; --brand-dark:#0A3675; --good:#1f8a4c; --warn:#c9862b; --bad:#c62330;
    --line:#aab9c6; --chip:#e7edf4;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1620; --card:#16222f; --ink:#e9eff6; --sub:#9bacc0;
      --brand:#2f6fe4; --brand-dark:#1f4fa8; --good:#3fbf72; --warn:#e0a94e; --bad:#e2695f;
      --line:#2b3b4f; --chip:#1c2a3a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1620; --card:#16222f; --ink:#e9eff6; --sub:#9bacc0;
    --brand:#2f6fe4; --brand-dark:#1f4fa8; --good:#3fbf72; --warn:#e0a94e; --bad:#e2695f;
    --line:#2b3b4f; --chip:#1c2a3a;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', -apple-system, sans-serif;
    min-height:100%;
  }
  header{
    position:sticky; top:0; z-index:10; background:linear-gradient(120deg,var(--brand-dark),var(--brand));
    color:#fff; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
  }
  header h1{margin:0 0 2px; font-size:19px; font-weight:700; font-family:'Fraunces', serif; letter-spacing:.01em;}
  header .sub{font-size:12.5px; opacity:.9;}
  .head-brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .head-drop{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex:0 0 auto;flex-shrink:0;}
  .head-sub{font-size:11.5px;opacity:.85;letter-spacing:.05em;margin-top:2px;}
  .roles{display:flex; gap:8px; margin-top:12px;}
  .role-btn{
    flex:1; padding:9px 6px; border-radius:6px; border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.12); color:#fff; font-size:13px; font-weight:600; cursor:pointer;
  }
  .role-btn.active{background:#fff; color:var(--brand-dark); border-color:#fff;}
  main{max-width:520px; margin:0 auto; padding:14px 14px 60px;}
  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:6px;
    padding:14px; margin-bottom:12px;
  }
  .card h2{margin:0 0 10px; font-size:15px; font-weight:700; color:var(--brand-dark); font-family:'Fraunces', serif;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  label{display:block; font-size:12px; color:var(--sub); margin:8px 0 4px; font-weight:600;}
  input[type=number], input[type=text], input[type=date], input[type=tel], input[type=password], select{
    width:100%; padding:10px 11px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:15px;
  }
  /* Canonical form field styling: use this for all standard text-entry fields. */
  .standard-field{
    width:100% !important; height:40px; box-sizing:border-box; padding:10px 11px !important;
    border-radius:6px !important; border:1px solid var(--line) !important;
    background:var(--bg) !important; color:var(--ink) !important; font-size:15px !important;
    font-family:inherit;
  }
  .pricebtns{display:flex; gap:8px;}
  .pricebtns button{
    flex:1; padding:9px 4px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .pricebtns button.sel{background:var(--brand); border-color:var(--brand); color:#fff;}
  .customer-form-stack{display:flex; flex-direction:column; gap:0;}
  .customer-form-stack input{width:100%; box-sizing:border-box;}
  .paybtns{display:flex; gap:8px; margin-top:2px;}
  .paybtns button{
    flex:1; padding:9px 4px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer;
  }
  .paybtns button.sel{background:var(--ink); border-color:var(--ink); color:var(--card);}
  .primary{
    width:100%; margin-top:14px; padding:13px; border:none; border-radius:4px;
    background:var(--bad); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  }
  .primary:active{background:#a81c27;}
  .primary.warn{background:var(--warn);}
  .ghost{
    width:100%; margin-top:8px; padding:10px; border-radius:4px; border:1px solid var(--line);
    background:transparent; color:var(--sub); font-size:13px; font-weight:600; cursor:pointer;
  }
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat{
    background:var(--chip); border-radius:6px; padding:10px 12px;
  }
  .stat .n{font-size:20px; font-weight:800; color:var(--brand-dark);}
  .stat .l{font-size:11.5px; color:var(--sub); margin-top:2px;}
  .pill{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px;
  }
  .pill.pending{background:#fbe9d0; color:#8a5a12;}
  .pill.confirmed{background:#d7f0dd; color:var(--good);}
  :root[data-theme="dark"] .pill.pending, @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.pending{background:#3a2b12; color:#e0a94e;}}
  :root[data-theme="dark"] .pill.confirmed, @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.confirmed{background:#123a22; color:#3fbf72;}}
  .feed-item{
    padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .feed-item:last-child{border-bottom:none;}
  .feed-item .top{display:flex; justify-content:space-between; font-weight:700;}
  .feed-item .meta{color:var(--sub); font-size:12px; margin-top:2px;}
  .empty{color:var(--sub); font-size:13px; text-align:center; padding:16px 4px;}
  .banner{
    display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:6px;
    font-size:13px; font-weight:600; margin-bottom:12px;
  }
  .banner.info{background:var(--chip); color:var(--brand-dark);}
  .banner.warn{background:#fbe9d0; color:#8a5a12;}
  .banner.bad{background:#fbe0dc; color:var(--bad);}
  .banner.good{background:#d7f0dd; color:var(--good);}
  .toast{
    position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:10px 16px; border-radius:99px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .25s ease, bottom .25s ease; z-index:50;
    white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{opacity:1; bottom:calc(30px + env(safe-area-inset-bottom,0px));}
  .small{font-size:12px; color:var(--sub);}
  .flexrow{display:flex; justify-content:space-between; align-items:center;}
  .divider{height:1px; background:var(--line); margin:12px 0;}
  .confirm-card{
    background:var(--chip); border:1.5px solid var(--brand); border-radius:8px;
    padding:14px; margin-bottom:12px;
  }
  .confirm-card .num{font-size:22px; font-weight:800; color:var(--brand-dark);}
  .confirm-card .details{font-size:14px; margin-top:4px;}
  .confirm-card .sub{font-size:12px; color:var(--sub); margin-top:2px;}
  .who-bar{
    display:flex; align-items:center; gap:8px; background:var(--chip);
    border-radius:6px; padding:8px 12px; margin-bottom:12px;
  }
  .who-bar input{flex:1; background:transparent; border:none; padding:4px 0; font-size:14px; font-weight:700; color:var(--ink);}
  .who-bar input:focus{outline:none;}
  .who-bar .lbl{font-size:11px; color:var(--sub); font-weight:600;}
  .countdown{
    background:var(--brand); color:#fff; border-radius:8px; padding:16px 18px;
    margin-bottom:12px; text-align:center;
  }
  .countdown .n{font-size:40px; font-weight:800; line-height:1;}
  .countdown .l{font-size:12.5px; opacity:.9; margin-top:4px; font-weight:600; letter-spacing:.3px;}
  .countdown .bar{
    height:7px; background:rgba(255,255,255,.28); border-radius:99px; margin-top:12px; overflow:hidden;
  }
  .countdown .bar-fill{height:100%; background:#fff; border-radius:99px;}
  .countdown.low{background:var(--warn);}
  .countdown.empty{background:var(--bad);}
  .emp-card{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:14px; margin-bottom:12px;
  }
  .emp-card .emp-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .emp-card .emp-head .name{font-size:15px; font-weight:800;}
  .tabbar{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:6px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto; padding:8px 14px; border-radius:99px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:13px; font-weight:700; cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .swipe-hint{text-align:center; font-size:11px; color:var(--sub); margin:2px 0 12px;}
  .mini-list{display:flex; flex-direction:column; gap:8px;}
  .mini-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--chip); border-radius:6px; padding:10px 12px; cursor:pointer;
  }
  .mini-row .mname{font-weight:700; font-size:13.5px;}
  .mini-row .mstats{font-size:12px; color:var(--sub); margin-top:2px;}
  .mini-row .marrow{color:var(--sub); font-size:16px;}

  /* ---------- VINTAGE COOL HUB NAVIGATION ---------- */
  .app-shell{min-height:100vh;display:flex;}
  .side-nav{position:fixed;left:0;top:0;bottom:0;width:238px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;z-index:20;display:flex;flex-direction:column;}
  .brand-lockup{padding:2px 10px 20px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .brand-lockup .brand-name{font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:var(--ink);}
  .brand-lockup .brand-product{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--brand);margin-top:3px;}
  .nav-group{display:flex;flex-direction:column;gap:4px;}
  .nav-item{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--sub);font:600 13px 'Work Sans',sans-serif;text-align:left;cursor:pointer;}
  .nav-item:hover{background:var(--chip);color:var(--ink);}
  .nav-item.active{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand-dark);}
  .nav-icon{width:20px;text-align:center;font-size:15px;}
  .nav-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;}
  .mobile-bottom-nav{display:none;}
  .app-content{margin-left:238px;min-width:0;flex:1;}
  header{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 22px;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  header h1{margin:0;font-size:19px;font-weight:700;font-family:'Fraunces',serif;}
  header .sub{font-size:12.5px;opacity:.9;}
  .role-area{display:flex;align-items:center;gap:8px;}
  .roles{display:flex;gap:6px;margin:0;}
  .role-btn{flex:0 0 auto;padding:7px 11px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
  .role-btn.active{background:#fff;color:var(--brand-dark);border-color:#fff;}
  header{background:linear-gradient(120deg,var(--brand-dark),var(--brand));}
  .head-brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .head-drop{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .head-sub{font-size:11.5px;opacity:.85;letter-spacing:.05em;margin-top:2px;}
  header h1{letter-spacing:.01em;}
  main{max-width:920px;margin:0 auto;padding:18px 22px 80px;}
  .mobile-menu-title{display:none;}
  .dashboard-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;}
  .dashboard-head h2{margin:0;font-family:'Fraunces',serif;font-size:25px;color:var(--ink);}
  .dashboard-head .date{font-size:12px;color:var(--sub);}
  .dash-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
  .dash-stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .dash-stat .icon{font-size:18px;margin-bottom:8px;}
  .dash-stat .value{font-size:22px;font-weight:800;color:var(--brand-dark);line-height:1.15;}
  .dash-stat .label{font-size:11.5px;color:var(--sub);margin-top:4px;}
  .dash-stat .hint{font-size:10.5px;color:var(--sub);margin-top:7px;}
  .dash-section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .dash-section h3{margin:0 0 11px;font-family:'Fraunces',serif;font-size:17px;color:var(--brand-dark);}
  .dash-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .dash-action{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px 8px;text-align:left;font:600 12px 'Work Sans',sans-serif;cursor:pointer;}
  .dash-action:hover{background:var(--chip);}
  .dash-action .aicon{font-size:16px;display:block;margin-bottom:5px;color:var(--brand);}
  .attention-list{display:flex;flex-direction:column;gap:8px;}
  .attention-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 11px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;}
  .attention-item.warn{background:#fff8e8;border-color:#efd9a8;}
  .attention-item.good{background:#eef9f1;border-color:#cbe8d3;}
  .attention-item .count{font-weight:800;color:var(--ink);white-space:nowrap;}
  .dash-table{width:100%;border-collapse:collapse;font-size:12px;}
  .dash-table th{text-align:left;color:var(--sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:7px 6px;border-bottom:1px solid var(--line);}
  .dash-table td{padding:9px 6px;border-bottom:1px solid var(--line);}
  .dash-table tr:last-child td{border-bottom:none;}
  .dash-table .num{text-align:right;font-weight:700;}
  @media(max-width:760px){
    .dashboard-head h2{font-size:23px;}
    .dash-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .dash-stat{padding:12px;}
    .dash-stat .value{font-size:20px;}
    .dash-actions{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:760px){
    .side-nav{display:none;}
    .app-content{margin-left:0;padding-bottom:72px;}
    header{padding:12px 14px;align-items:flex-start;}
    header h1{font-size:18px;}
    .role-area{flex-direction:column;align-items:flex-end;gap:5px;}
    .roles{display:flex;}
    .role-btn{font-size:11px;padding:6px 8px;}
    main{max-width:520px;padding:12px 14px 90px;}
    .mobile-bottom-nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:stretch;gap:2px;padding:7px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.12);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;}
    .mobile-bottom-nav::-webkit-scrollbar{display:none;}
    .mobile-bottom-nav .nav-item{flex:0 0 76px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:5px 2px;font-size:9px;text-align:center;scroll-snap-align:center;}
    .mobile-bottom-nav .nav-icon{font-size:16px;line-height:16px;width:auto;}
    .mobile-bottom-nav .nav-item.active{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand-dark);}
    .mobile-bottom-nav::after{content:"";flex:0 0 4px;}
  }

  /* ---------- SALES / CUSTOMERS / CREDIT WORKSPACE ---------- */
  .workspace-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;}
  .workspace-head h2{margin:0;font-family:'Fraunces',serif;font-size:25px;color:var(--ink);}
  .workspace-head .subline{font-size:12px;color:var(--sub);margin-top:3px;}
  .workspace-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px;}
  .workspace-stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;}
  .workspace-stat .v{font-size:20px;font-weight:800;color:var(--brand-dark);}
  .workspace-stat .l{font-size:11px;color:var(--sub);margin-top:4px;}
  .money-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub);}
  .money-line strong{color:var(--ink);font-size:13px;}
  .money-line.total{font-weight:800;color:var(--ink);border-bottom:2px solid var(--line);}
  .money-line.total strong{color:var(--brand-dark);font-size:15px;}
  .workspace-card .meta strong{color:var(--ink);}
  .workspace-two{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;}
  .workspace-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .workspace-card h3{margin:0 0 11px;font-family:'Fraunces',serif;font-size:18px;color:var(--brand-dark);}
  .workspace-card h4{margin:14px 0 7px;font-size:13px;color:var(--ink);}
  .workspace-search{display:flex;gap:8px;margin-bottom:10px;}
  .workspace-search input{flex:1;min-width:0;}
  .workspace-list{display:flex;flex-direction:column;gap:7px;}
  .workspace-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;}
  .workspace-row .main{min-width:0;}
  .workspace-row .title{font-weight:800;font-size:13px;color:var(--ink);}
  .workspace-row .meta{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.35;}
  .workspace-row .amount{font-weight:800;white-space:nowrap;color:var(--brand-dark);}
  .workspace-row button{flex:0 0 auto;}
  .status-pill{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800;background:var(--chip);color:var(--sub);}
  .status-pill.pending{background:#fff8e8;color:#8a6412;}
  .status-pill.approved{background:#eef9f1;color:#24723a;}
  .status-pill.rejected{background:#fff0f0;color:#a62b32;}
  .balance-positive{color:#b42318;font-weight:800;}
  .balance-zero{color:#24723a;font-weight:800;}
  .module-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;}
  .module-tabs::-webkit-scrollbar{display:none;}
  .module-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .module-tab.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  .form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .btn-secondary{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer;}
  .btn-danger{border:1px solid #e4b9bd;background:#fff0f0;color:#a62b32;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer;}
  .empty-state{padding:20px 10px;text-align:center;color:var(--sub);font-size:13px;}
  .detail-box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:9px;}
  .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .detail-grid .item{font-size:12px;color:var(--sub);}

  let docs = (rows||[]).map(r=>({ id:r.id, data:()=>r }));
  if(ob){ const k=ob[0], dir=ob[1]==="desc"?-1:1; docs.sort((a,b)=>{ const va=a.data()[k]||0, vb=b.data()[k]||0; return (va<vb?-1:va>vb?1:0)*dir; }); }
  if(lim) docs = docs.slice(0, lim);
  return { docs:docs };
}
function startPolling(fn, ms){
  fn();
  const iv = setInterval(fn, ms||4000);
  return ()=>clearInterval(iv);
}
function SupaDb(){
  this.collection = function(path){
    const loc = parseDbPath(path);
    const q = { _ob:null, _lim:null };
    q.orderBy = function(f,dir){ q._ob=[f,dir]; return q; };
    q.limit = function(n){ q._lim=n; return q; };
    q.onSnapshot = function(cb, errCb){
      let last = "";
      return startPolling(async ()=>{
        try{
          const filter = loc.day ? ("?day=eq."+encodeURIComponent(loc.day)+"&select=*") : "?select=*";
          const rows = await sbReq(loc.table+filter);
          const j = JSON.stringify(rows||[]);
          if(j===last) return;
          last = j;
          cb(buildSnap(rows, q._ob, q._lim));
        }catch(e){ if(errCb) errCb(e); }
      });
    };
    q.add = async function(obj){
      const body = Object.assign({}, obj, { id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2,8)) });
      if(loc.day) body.day = loc.day;
      await sbReq(loc.table, { method:"POST", prefer:"return=minimal", body:body });
      return { id: body.id };
    };
    return q;
  };
  this.range = async function(path, fromDay, toDay){
    const segs = String(path).split("/");
    let table, col;
    if(segs[0]==="days"){
      table = segs[2]==="employees" ? "day_employees" : "day_sales";
      col = "day";
    } else if(segs[0]==="customerPayments"){
      const fromMs = new Date(fromDay+"T00:00:00").getTime();
      const toMs = new Date(toDay+"T23:59:59.999").getTime();
      return await sbReq("customer_payments?ts=gte."+fromMs+"&ts=lte."+toMs+"&select=*&limit=10000");
    } else {
      table = TABLE_MAP[segs[0]] || segs[0];
      col = "date";
    }
    return await sbReq(table+"?"+col+"=gte."+fromDay+"&"+col+"=lte."+toDay+"&select=*&limit=10000");
  };
  this.doc = function(path){
    const loc = parseDbPath(path);
    const filt = loc.day ? ("id=eq."+encodeURIComponent(loc.id)+"&day=eq."+encodeURIComponent(loc.day)) : ("id=eq."+encodeURIComponent(loc.id));
    return {
      set: async function(obj){
        const body = Object.assign({}, obj, { id: loc.id });
        if(loc.day) body.day = loc.day;
        await sbReq(loc.table+"?on_conflict=id", { method:"POST", prefer:"resolution=merge-duplicates", body:body });
      },
      update: async function(obj){
        await sbReq(loc.table+"?"+filt, { method:"PATCH", prefer:"return=minimal", body:obj });
      },
      delete: async function(){
        await sbReq(loc.table+"?"+filt, { method:"DELETE", prefer:"return=minimal" });
      },
      onSnapshot: function(cb, errCb){
        let last = "";
        return startPolling(async ()=>{
          try{
            const rows = await sbReq(loc.table+"?"+filt+"&select=*");
            const j = JSON.stringify(rows||[]);
            if(j===last) return;
            last = j;
            const r = (rows&&rows[0])||null;
            cb({ exists: !!r, data:()=>r||{} });
          }catch(e){ if(errCb) errCb(e); }
        });
      }
    };
  };
  return this;
}
function createSupaDb(){ return new SupaDb(); }
/* ===== end adapter ===== */

function subscribeDay(dateStr){
  if(unsubEmployees) unsubEmployees();
  if(unsubSales) unsubSales();
  employeesData = []; salesData = []; ownerTabId = "all";
  if(!db){ renderAll(); return; }

  unsubEmployees = db.collection(`days/${dateStr}/employees`).onSnapshot(snap=>{
    employeesData = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, err=>{ console.error(err); });

  unsubSales = db.collection(`days/${dateStr}/sales`).orderBy("ts","desc").limit(500).onSnapshot(snap=>{
    salesData = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, err=>{ console.error(err); });

  if(window._unsubCustomers) window._unsubCustomers();
  if(window._unsubCredits) window._unsubCredits();
  if(window._unsubPayments) window._unsubPayments();
  if(window._unsubStock) window._unsubStock();
  if(window._unsubTrips) window._unsubTrips();
  if(window._unsubRoutes) window._unsubRoutes();
  window._unsubTrips = db.collection("trips").limit(2000).onSnapshot(snap=>{ tripsData=snap.docs.map(d=>({id:d.id,...d.data()})); renderAll(); }, err=>console.error(err));
  window._unsubRoutes = db.collection("routes").limit(500).onSnapshot(snap=>{ routesData=snap.docs.map(d=>({id:d.id,...d.data()})); renderAll(); }, err=>console.error(err));
  window._unsubStock = db.collection("stockTransactions").limit(2000).onSnapshot(snap=>{
    stockData = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, err=>{ console.error(err); });
  window._unsubCustomers = db.collection("customers").limit(1000).onSnapshot(snap=>{
    customersData = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, err=>{ console.error(err); });
  window._unsubCredits = db.collection("creditTransactions").limit(1000).onSnapshot(snap=>{
    creditData = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, err=>{ console.error(err); });
  window._unsubPayments = db.collection("customerPayments").limit(1000).onSnapshot(snap=>{
    paymentData = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, err=>{ console.error(err); });
}

// ---------- shared helpers ----------
function computeTotalsFor(record, sales){
  let bagsSold=0, cash=0, momo=0, credit=0, free=0, damaged=0;
  sales.forEach(s=>{
    bagsSold += s.bags||0;
    free += s.freeBags||0;
    damaged += s.damagedBags||0;
    if(s.paymentType==="cash") cash += s.amount||0;
    else if(s.paymentType==="momo") momo += s.amount||0;
    else if(s.paymentType==="credit") credit += s.amount||0;
  });
  const bagsLoaded = record?.bagsLoaded ?? null;
  const bagsRemaining = (bagsLoaded!=null) ? (bagsLoaded - bagsSold - free) : null;
  return {bagsSold, cash, momo, credit, free, damaged, bagsLoaded, bagsRemaining};
}
// Union of everyone with a load/return record AND anyone who has only sales logged so far
function getEmployeeList(){
  const map = new Map();
  employeesData.forEach(e=>{
    map.set(e.id, {id:e.id, name: e.employeeName || e.id, record: e});
  });
  salesData.forEach(s=>{
    if(!s.employeeName) return;
    const id = slugify(s.employeeName);
    if(!map.has(id)) map.set(id, {id, name: s.employeeName, record: null});
  });
  return Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name));
}
function salesFor(empId){
  return salesData.filter(s => slugify(s.employeeName||"") === empId);
}
function recordFor(empId){
  return employeesData.find(e=>e.id===empId) || null;
}

    html += `<div class="banner bad">❌ ${managerError} <span id="dismissMgrErr" style="text-decoration:underline; cursor:pointer; margin-left:6px;">Dismiss</span></div>`;
  }

  if(employees.length===0){
    html += `<div class="card"><div class="empty">No employees have logged anything yet today</div></div>`;
  }

  employees.forEach(emp=>{
    const record = emp.record;
    const sales = salesFor(emp.id);
    const t = computeTotalsFor(record, sales);
    const expectedReturn = t.bagsRemaining;
    const expectedCash = t.cash, expectedMomo = t.momo;

    html += `<div class="emp-card">
      <div class="emp-head"><span class="name">👤 ${escapeHtml(emp.name)}</span><span class="small">${t.bagsSold} bags sold</span></div>`;

      html += `<div class="small">No load logged for ${escapeHtml(emp.name)} yet.</div>`;

      html += `
        <div class="flexrow"><span>Load: <b>${record.bagsLoaded} bags</b></span><span class="pill pending">pending</span></div>

        <input type="number" id="mgrLoadConfirm-${emp.id}" value="${record.bagsLoaded}" inputmode="numeric" min="0">
        <button class="primary" data-confirm-load="${emp.id}">Confirm load</button>`;
    } else {
      html += `<div class="flexrow"><span>Load: ${record.bagsLoaded} bags</span><span class="pill confirmed">confirmed</span></div>`;
    }

    html += `<div class="divider"></div>`;

    // Return
    if(!record || record.bagsReturned==null){
      html += `<div class="small">Expected if route ended now: ${expectedReturn ?? "–"} bags, ${money(expectedCash)} cash, ${money(expectedMomo)} momo. No return logged yet.</div>`;
    } else if(record.returnStatus==="pending"){
      const bagDiff = record.bagsReturned - (expectedReturn ?? record.bagsReturned);
      const cashDiff = record.cashReturned - expectedCash;
      html += `
        <div class="flexrow"><span>Return reported</span><span class="pill pending">pending</span></div>
        <div class="small" style="margin-top:6px;">Reported: ${record.bagsReturned} bags, ${money(record.cashReturned)} cash, ${money(record.momoReturned)} momo</div>
        <div class="small">Expected: ${expectedReturn ?? "–"} bags, ${money(expectedCash)} cash, ${money(expectedMomo)} momo</div>
        ${Math.abs(bagDiff)>0 || Math.abs(cashDiff)>0 ? `<div class="banner bad" style="margin-top:8px;">⚠️ Discrepancy: ${bagDiff} bags, ${money(cashDiff)} cash</div>` : `<div class="banner info" style="margin-top:8px;">Matches sales log</div>`}
        <label>Confirm final bags returned</label>
        <input type="number" id="mgrRetConfirmBags-${emp.id}" value="${record.bagsReturned}" inputmode="numeric" min="0">
        <label>Confirm final cash</label>
        <input type="number" id="mgrRetConfirmCash-${emp.id}" value="${record.cashReturned}" inputmode="numeric" min="0">
        <button class="primary" data-confirm-return="${emp.id}">Confirm return</button>`;
    } else {
      html += `<div class="flexrow"><span>${record.bagsReturned} bags, ${money(record.cashReturned)} cash, ${money(record.momoReturned)} momo</span><span class="pill confirmed">confirmed</span></div>`;
    }

    html += `</div>`;
  });

  html += `<div class="card"><h2>Today's sales log (all employees)</h2>${renderFeed(salesData)}</div>`;

  if(employees.length>0){
    html += `<div class="card">
      <h2>⚠️ Delete test/mistaken data for this day</h2>
      <div class="small" style="margin-bottom:8px;">Permanently deletes this employee's load, return and all sales for ${fmtDateLabel(currentDate)} only. Cannot be undone.</div>
      <div class="mini-list">
      ${employees.map(e=>`<div class="mini-row"><div class="mname">${escapeHtml(e.name)}</div><span class="small" data-wipe-emp="${e.id}" style="text-decoration:underline; cursor:pointer; color:var(--bad);">Delete this day's data</span></div>`).join("")}
      </div>
    </div>`;
  }

  el.innerHTML = html;

  const dismissMgrErr = document.getElementById("dismissMgrErr");
  if(dismissMgrErr) dismissMgrErr.addEventListener("click", ()=>{ managerError = null; preserveThenRender("view-manager", renderManager); });

  el.querySelectorAll("[data-wipe-emp]").forEach(span=>{
    span.addEventListener("click", async ()=>{
      const id = span.dataset.wipeEmp;
      const emp = getEmployeeList().find(e=>e.id===id);
      const label = emp ? emp.name : id;
      if(!confirm(`Delete all of ${label}'s data for ${fmtDateLabel(currentDate)}? This cannot be undone.`)) return;
      if(!db) return;
      try{
        await db.doc(`days/${currentDate}/employees/${id}`).delete();
        const theirSales = salesFor(id);
        for(const s of theirSales){
          await db.doc(`days/${currentDate}/sales/${s.id}`).delete();
        }
        showToast(`Deleted ${label}'s data for this day`);
      }catch(e){ managerError = describeDbError(e); preserveThenRender("view-manager", renderManager); }
    });
  });

  const mgrAddLoadBtn = document.getElementById("mgrAddLoadBtn");
  if(mgrAddLoadBtn) mgrAddLoadBtn.addEventListener("click", async ()=>{
    const id = document.getElementById("mgrNewEmp").value;
    const bags = parseFloat(document.getElementById("mgrNewBags").value);
    const emp = rosterData.find(e=>e.id===id);
    if(!emp){ showToast("Select an employee from the list"); return; }
    if(!bags || bags<=0){ showToast("Enter bags loaded"); return; }
    if(!db){ showToast("No live sync in this preview"); return; }
    try{
      await db.doc(`days/${currentDate}/employees/${id}`).set({
        employeeName: emp.name, bagsLoaded: bags, loadStatus:"confirmed",
        loadReportedBy:"manager", loadConfirmedBy:"manager", loadConfirmedAt: Date.now()
      });
      managerError = null;
      showToast(`Load confirmed for ${emp.name}`);
    }catch(e){ managerError = describeDbError(e); preserveThenRender("view-manager", renderManager); }
  });

  el.querySelectorAll("[data-confirm-load]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = btn.dataset.confirmLoad;
      const bags = parseFloat(document.getElementById(`mgrLoadConfirm-${id}`).value);
      if(anyNegative(bags)){ showToast("Bags can't be negative"); return; }
      if(!db) return;
      try{
        await db.doc(`days/${currentDate}/employees/${id}`).update({
          bagsLoaded: bags, loadStatus:"confirmed", loadConfirmedBy:"manager", loadConfirmedAt: Date.now()
        });
        managerError = null;
        showToast("Load confirmed");
      }catch(e){ managerError = describeDbError(e); preserveThenRender("view-manager", renderManager); }
    });

  el.querySelectorAll("[data-confirm-return]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = btn.dataset.confirmReturn;

      if(!db) return;
      try{
        await db.doc(`days/${currentDate}/employees/${id}`).update({
          bagsReturned: bags, cashReturned: cash,
          returnStatus:"confirmed", returnConfirmedBy:"manager", returnConfirmedAt: Date.now()
        });
        managerError = null;
        showToast("Return confirmed");
      }catch(e){ managerError = describeDbError(e); preserveThenRender("view-manager", renderManager); }
    });
  });
}

  });

  const addEmpBtn = document.getElementById("addEmpBtn");
  if(addEmpBtn) addEmpBtn.addEventListener("click", async ()=>{
    const name = document.getElementById("newEmpName").value.trim();

    if(!db){ showToast("No live sync in this preview"); return; }
    const id = slugify(name);

    try{
      await db.doc(`roster/${id}`).set({ name, active:true, addedAt: Date.now() });
      showToast(`Added ${name}`);
      document.getElementById("newEmpName").value="";
    }catch(e){ showToast(describeDbError(e)); }
  });

  el.querySelectorAll("[data-remove-emp]").forEach(span=>{
    span.addEventListener("click", async ()=>{
      const id = span.dataset.removeEmp;
      if(!db) return;
      try{
        await db.doc(`roster/${id}`).update({ active:false });
        showToast("Removed");
      }catch(e){ showToast(describeDbError(e)); }
    });
  });

  // swipe left/right on the owner view to move between tabs
  let touchStartX = null;
  el.addEventListener("touchstart", (e)=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", (e)=>{
    if(touchStartX==null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if(Math.abs(dx) < 60) return; // not a real swipe
    const order = ["all", ...employees.map(e=>e.id)];
    const idx = order.indexOf(ownerTabId);
    if(idx===-1) return;
    let nextIdx = dx < 0 ? idx+1 : idx-1; // swipe left = next, swipe right = previous
    nextIdx = Math.max(0, Math.min(order.length-1, nextIdx));
    if(nextIdx!==idx){ ownerTabId = order[nextIdx]; renderCousin(); }
  }, {passive:true});
}

function renderFeed(items){
  if(!items || items.length===0) return `<div class="empty">No sales logged yet</div>`;
  const total = items.length;
  return items.map((s,i)=>{
    const time = s.ts ? new Date(s.ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) : "";
    const payLabel = s.paymentType==="cash"?"Cash":s.paymentType==="momo"?"MoMo":"Credit";
    const entryNum = total - i; // items are newest-first, so #1 is the earliest of the day
    return `<div class="feed-item">
      <div class="top"><span>#${entryNum} · ${s.bags} bags @ ${s.pricePerBag}</span><span>${money(s.amount)}</span></div>
      <div class="meta">${s.employeeName?escapeHtml(s.employeeName)+" · ":""}${payLabel}${s.customerName?" · "+escapeHtml(s.customerName):""}${s.freeBags?" · +"+s.freeBags+" free":""}${s.damagedBags?" · "+s.damagedBags+" damaged":""} · ${time}</div>
    </div>`;
  }).join("");
}

function renderCountdown(t){
  if(t.bagsLoaded==null){
    return `<div class="countdown"><div class="n">–</div><div class="l">NO LOAD LOGGED YET</div></div>`;
  }
  const remaining = Math.max(t.bagsRemaining, 0);
  const pctLeft = t.bagsLoaded>0 ? Math.max(0, Math.min(100, (remaining/t.bagsLoaded)*100)) : 0;
  let cls = "countdown";
  if(remaining<=0) cls += " empty";
  else if(pctLeft<=15) cls += " low";
  return `<div class="${cls}">
    <div class="n">${remaining}</div>
    <div class="l">BAGS LEFT UNSOLD (of ${t.bagsLoaded} loaded)</div>
    <div class="bar"><div class="bar-fill" style="width:${pctLeft}%"></div></div>
  </div>`;
}

function currentRole(){
  if(currentUser && currentUser.role==="cousin" && ownerPreview) return ownerPreview;
  return currentUser ? currentUser.role : "employee";
}

// ---------- DASHBOARD: period view (owner/manager) + My Day (employee) ----------
let dashPeriod="today", dashFrom="", dashTo="", dashCache=null, dashInflight="";

function fmtDay(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function periodRange(key){
  const today=todayStr(); const now=new Date();
  if(key==="week"){ const s=new Date(now); s.setDate(s.getDate()-6); return {from:fmtDay(s),to:today,label:"Last 7 days"}; }
  if(key==="month"){ return {from:fmtDay(new Date(now.getFullYear(),now.getMonth(),1)),to:today,label:"This month"}; }
  if(key==="ytd"){ return {from:fmtDay(new Date(now.getFullYear(),0,1)),to:today,label:"Year to date"}; }
  if(key==="custom"&&dashFrom&&dashTo){ return {from:dashFrom,to:dashTo,label:fmtDateLabel(dashFrom)+" → "+fmtDateLabel(dashTo)}; }
  return {from:today,to:today,label:"Today"};
}
function prevRangeOf(r){
  const f=new Date(r.from+"T00:00:00"), t=new Date(r.to+"T00:00:00");
  const days=Math.round((t-f)/86400000)+1;
  const pe=new Date(f); pe.setDate(pe.getDate()-1);
  const ps=new Date(pe); ps.setDate(ps.getDate()-days+1);
  return {from:fmtDay(ps),to:fmtDay(pe)};
}
async function fetchDashRange(r){
  const [sales,trips,emps,credits,payments,stock]=await Promise.all([
    db.range("days/x/sales",r.from,r.to),
    db.range("trips",r.from,r.to),
    db.range("days/x/employees",r.from,r.to),
    db.range("creditTransactions",r.from,r.to),
    db.range("customerPayments",r.from,r.to),
    db.range("stockTransactions",r.from,r.to)
  ]);
  return {sales:sales||[],trips:trips||[],emps:emps||[],credits:credits||[],payments:payments||[],stock:stock||[]};
}
function sumSales(list){
  const t={bags:0,rev:0,cash:0,momo:0,credit:0,free:0,damaged:0};
  list.forEach(s=>{ t.bags+=s.bags||0; t.rev+=s.amount||0; t.free+=s.freeBags||0; t.damaged+=s.damagedBags||0;
    if(s.paymentType==="cash")t.cash+=s.amount||0; else if(s.paymentType==="momo")t.momo+=s.amount||0; else if(s.paymentType==="credit")t.credit+=s.amount||0; });
  return t;
}
function deltaPill(cur,prev){
  if(!prev) return `<span class="kpi-delta">no prior period</span>`;
  const pct=((cur-prev)/prev)*100; const up=pct>=0;
  return `<span class="kpi-delta ${up?"up":"down"}">${up?"▲":"▼"} ${Math.abs(pct).toFixed(0)}% vs previous</span>`;
}
function buildTrend(sales, from, to){
  const byDay={};
  sales.forEach(s=>{ const d=s.day||""; if(!d) return; byDay[d]=(byDay[d]||0)+(s.amount||0); });
  const spanDays=Math.round((new Date(to+"T00:00:00")-new Date(from+"T00:00:00"))/86400000)+1;
  let buckets=[];
  if(spanDays>400){
    const mo={}; Object.keys(byDay).forEach(k=>{ const m=k.slice(0,7); mo[m]=(mo[m]||0)+byDay[k]; });
    buckets=Object.keys(mo).sort().map(k=>({day:k,rev:mo[k]}));
  } else if(spanDays>62){
    const wk={};
    Object.keys(byDay).forEach(k=>{ const d=new Date(k+"T00:00:00"); const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); const key=fmtDay(m); wk[key]=(wk[key]||0)+byDay[k]; });
    buckets=Object.keys(wk).sort().map(k=>({day:"w/c "+k.slice(5),rev:wk[k]}));
  } else {
    const cur=new Date(from+"T00:00:00"); const end=new Date(to+"T00:00:00");
    while(cur<=end){ const k=fmtDay(cur); buckets.push({day:k.slice(5),rev:byDay[k]||0}); cur.setDate(cur.getDate()+1); }
  }
  return buckets;
}
function trendChart(buckets){
  if(!buckets.length) return `<div class="empty-state">No sales in this period.</div>`;
  const W=Math.max(buckets.length*30,280), H=170, max=Math.max(...buckets.map(b=>b.rev),1);
  const step=W/buckets.length, bw=Math.max(6,step-6);
  const bars=buckets.map((b,i)=>{
    const h=Math.max(2,(b.rev/max)*(H-32));
    const x=i*step+3, y=H-22-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="#114B9F"><title>${b.day}: GHS ${(Math.round(b.rev*100)/100).toLocaleString()}</title></rect>`;
  }).join("");
  return `<div class="chart-scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}<line x1="0" y1="${H-22}" x2="${W}" y2="${H-22}" stroke="#aab9c6" stroke-width="1"/></svg></div><div class="chart-axis"><span>${escapeHtml(buckets[0].day)}</span><span>${escapeHtml(buckets[buckets.length-1].day)}</span></div>`;
}

function renderDashboard(){
  const el=document.getElementById('view-dashboard');
  const role=currentRole();
  if(role==='employee'){ renderEmployeeDash(el); return; }
  if(role==='manager'){ renderManagerDash(el); return; }

  const range=periodRange(dashPeriod);
  const chips=[["today","Today"],["week","7 Days"],["month","This Month"],["ytd","YTD"],["custom","Custom"]]
    .map(c=>`<button class="chip ${dashPeriod===c[0]?"active":""}" data-period="${c[0]}">${c[1]}</button>`).join("");
  el.innerHTML=`<div class="dashboard-head">
    <div><h2>Business Dashboard</h2><div class="date">${range.label} · data through ${fmtDateLabel(range.to)}</div></div>
    <button class="btn-secondary" id="dashRefresh" style="padding:7px 12px;font-size:12px">↻ Refresh</button>
  </div>
  <div class="period-chips">${chips}</div>
  <div class="period-custom" style="display:${dashPeriod==="custom"?"flex":"none"}">
    <input type="date" id="dashFrom" value="${dashFrom||range.from}"><span class="small">to</span><input type="date" id="dashTo" value="${dashTo||range.to}"><button class="btn-secondary" id="dashApply">Apply</button>
  </div>
  <div id="dashBody"><div class="empty-state" style="margin-top:14px">Loading dashboard…</div></div>`;
  el.querySelectorAll("[data-period]").forEach(b=>b.addEventListener("click",()=>{ if(dashPeriod!==b.dataset.period){ dashPeriod=b.dataset.period; renderDashboard(); } }));
  const ap=el.querySelector("#dashApply");
  if(ap) ap.addEventListener("click",()=>{ const f=el.querySelector("#dashFrom").value, t=el.querySelector("#dashTo").value; if(f&&t){ if(f>t){ showToast("Start date must be before end date"); return; } dashFrom=f; dashTo=t; renderDashboard(); } });
  const rf=el.querySelector("#dashRefresh");
  if(rf) rf.addEventListener("click",()=>{ dashCache=null; renderDashboard(); showToast("Refreshing…"); });

  const body=el.querySelector("#dashBody");
  if(!db||!db.range){ body.innerHTML=`<div class="empty-state" style="margin-top:14px">Dashboard data unavailable — check connection.</div>`; return; }
  const key=range.from+"|"+range.to;
  if(dashCache&&dashCache.key===key){ renderDashBody(el,range,dashCache.data,dashCache.prev); return; }
  if(dashInflight===key) return;
  dashInflight=key;
  const pr=prevRangeOf(range);
  Promise.all([fetchDashRange(range), db.range("days/x/sales",pr.from,pr.to)]).then(([data,prevSales])=>{
    dashInflight="";
    dashCache={key,data,prev:prevSales||[]};
    renderDashBody(el,range,data,prevSales||[]);
  }).catch(()=>{ dashInflight=""; const b=el.querySelector("#dashBody"); if(b) b.innerHTML=`<div class="empty-state" style="margin-top:14px">Couldn't load dashboard — check connection and tap Refresh.</div>`; });
}

function renderDashBody(el, range, data, prevSales){
  const body=el.querySelector("#dashBody"); if(!body) return;

  const elapsedDays=Math.max(1,Math.min(spanDays,Math.round((new Date(todayStr()+"T00:00:00")-new Date(range.from+"T00:00:00"))/86400000)+1));
  const avg=t.rev/elapsedDays;

  const kpi=`<div class="owner-kpi-grid" style="margin-top:14px">

    <div class="owner-kpi"><div class="k-label">MoMo collected</div><div class="k-value">${money(t.momo)}</div><div class="k-note">Recorded MoMo payments</div></div>
    <div class="owner-kpi"><div class="k-label">Credit sales</div><div class="k-value">${money(t.credit)}</div><div class="k-note">Sales recorded as credit</div></div>

  const byDay={};
  data.sales.forEach(s=>{ const d=s.day||""; if(!d) return; byDay[d]=(byDay[d]||0)+(Number(s.amount)||0); });
  let chart=[];
  if(dashPeriod==="ytd"){
    const yr=range.from.slice(0,4), endM=Number(range.to.slice(5,7));
    for(let m=1;m<=endM;m++){ const key=yr+"-"+String(m).padStart(2,"0"); const rev=Object.keys(byDay).filter(k=>k.startsWith(key)).reduce((a,k)=>a+byDay[k],0); chart.push({label:new Date(Number(yr),m-1,1).toLocaleDateString(undefined,{month:"short"}),rev}); }
  }else{
    const start=new Date(range.from+"T00:00:00");
    const days=Math.max(1,Math.round((new Date(range.to+"T00:00:00")-start)/86400000)+1);
    const step=days>35?Math.ceil(days/14):1;
    for(let i=0;i<days;i+=step){ let rev=0; for(let j=i;j<Math.min(days,i+step);j++){ const d=new Date(start); d.setDate(d.getDate()+j); rev+=byDay[fmtDay(d)]||0; } const d=new Date(start); d.setDate(d.getDate()+i); chart.push({label:days>35?d.toLocaleDateString(undefined,{month:"short",day:"numeric"}):d.toLocaleDateString(undefined,{day:"numeric"}),rev}); }
  }
  const maxRev=Math.max(1,...chart.map(x=>x.rev));
  const chartHtml=chart.length?chart.map(x=>`<div class="owner-bar-col" title="${escapeHtml(x.label)}: ${money(x.rev)}"><div class="owner-bar-value">${x.rev?money(x.rev):"—"}</div><div class="owner-bar" style="height:${Math.max(2,(x.rev/maxRev)*100)}%"></div><div class="owner-bar-label">${escapeHtml(x.label)}</div></div>`).join(""):'<div class="empty-state">No sales in this period.</div>';
  const trend=`<div class="owner-panel"><h3>Revenue trend</h3><div class="owner-chart">${chartHtml}</div><div class="owner-note">Revenue is grouped by day for shorter periods and by month for YTD. Empty periods display as zero; figures reflect recorded sales only.</div></div>`;

  const change=p.rev?((t.rev-p.rev)/p.rev*100):null;
  const changeText=change===null?"No previous-period baseline":`${change>=0?"↑":"↓"} ${Math.abs(change).toFixed(1)}% vs previous period`;

  let monthTable="";

    <div class="money-line"><span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#F2A007;margin-right:7px"></span>📱 MoMo</span><strong>${money(t.momo)} · ${(t.momo/totMix*100).toFixed(0)}%</strong></div>

  const byEmp={};

  const topEmp=Object.keys(byEmp).map(k=>({name:k,...byEmp[k]})).sort((a,b)=>b.rev-a.rev).slice(0,5);
  const empCard=`<div class="workspace-card"><h3>Top employees</h3><div class="workspace-list">${topEmp.map((e,i)=>`<div class="workspace-row"><div class="main"><div class="title">${i+1}. ${escapeHtml(e.name)}</div><div class="meta">${e.bags.toLocaleString()} bags</div></div><span class="amount">${money(e.rev)}</span></div>`).join("")||'<div class="empty-state">No sales in this period.</div>'}</div></div>`;

  const byRoute={};

  const owingIds=new Set(owing.map(x=>x.c.id));
  const byCust={};
  data.sales.forEach(s=>{ if(!s.customerName) return; const k=s.customerId||s.customerName; byCust[k]=byCust[k]||{name:s.customerName,rev:0,id:s.customerId}; byCust[k].rev+=s.amount||0; });
  const topCust=Object.keys(byCust).map(k=>byCust[k]).sort((a,b)=>b.rev-a.rev).slice(0,5);
  const custCard=`<div class="workspace-card"><h3>Top customers</h3><div class="workspace-list">${topCust.map((c,i)=>{const owes=c.id?customerBalance(c.id):0;return `<div class="workspace-row"><div class="main"><div class="title">${i+1}. ${escapeHtml(c.name)}</div><div class="meta">Bought ${money(c.rev)} this period${owes>0?` · <span style="color:#F40000;font-weight:700">still owes ${money(owes)}</span>`:' · fully paid'}</div></div><span class="amount">${money(c.rev)}</span></div>`;}).join("")||'<div class="empty-state">No named customers in this period.</div>'}</div></div>`;

  const discrepancies=data.emps.filter(rec=>{
    if(rec.bagsReturned==null) return false;

  }).length;

    <div class="money-line"><span>Pending confirmations today</span><strong>${pendingConf}</strong></div></div>`;

  body.innerHTML=kpi+`<div class="owner-analytics-grid">${trend}${compare}</div>`+monthTable+`<div class="workspace-two" style="margin-top:2px">${mix}${empCard}</div><div class="workspace-two" style="margin-top:14px">${routeCard}${custCard}</div><div style="margin-top:14px">${ops}</div><div class="form-actions" style="margin:14px 0 6px"><button class="btn-secondary" id="dashExport">Export ${range.label} CSV</button></div>`;

function exportDashCsv(range,data,t,collections){
  const rows=[["VINTAGE COOL — BUSINESS DASHBOARD EXPORT"],["Period",range.from+" to "+range.to],[],
    ["SUMMARY"],["Revenue",t.rev.toFixed(2)],["Bags sold",t.bags],["Cash sales",t.cash.toFixed(2)],["MoMo sales",t.momo.toFixed(2)],["Credit issued",t.credit.toFixed(2)],["Debt payments collected",collections.toFixed(2)],["Free bags",t.free],["Damaged bags",t.damaged],[],
    ["DAILY BREAKDOWN"],["Date","Bags","Revenue","Cash","MoMo","Credit","Free","Damaged"]];
  const days={};
  data.sales.forEach(s=>{ const d=s.day||""; if(!d) return; days[d]=days[d]||[]; days[d].push(s); });
  Object.keys(days).sort().forEach(d=>{ const x=sumSales(days[d]); rows.push([d,x.bags,x.rev.toFixed(2),x.cash.toFixed(2),x.momo.toFixed(2),x.credit.toFixed(2),x.free,x.damaged]); });
  rows.push([],["EMPLOYEE BREAKDOWN"],["Employee","Bags","Revenue"]);
  const byEmp={};
  data.sales.forEach(s=>{ const k=s.employeeName||"Unknown"; byEmp[k]=byEmp[k]||{bags:0,rev:0}; byEmp[k].bags+=s.bags||0; byEmp[k].rev+=s.amount||0; });
  Object.keys(byEmp).sort((a,b)=>byEmp[b].rev-byEmp[a].rev).forEach(k=>rows.push([k,byEmp[k].bags,byEmp[k].rev.toFixed(2)]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}); const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`vintage-cool-dashboard-${range.from}_${range.to}.csv`; a.click(); URL.revokeObjectURL(url);
}

function customerBalance(id){
  const credits=creditData.filter(x=>x.customerId===id && x.status==='approved').reduce((a,x)=>a+(x.amount||0),0);
  const payments=paymentData.filter(x=>x.customerId===id && x.status!=='rejected').reduce((a,x)=>a+(x.amount||0),0);
  return credits-payments;
}

function stockNetTransactions(dateStr){
  return stockData.filter(x=>!dateStr || x.date===dateStr);
}
function stockMovementForDate(dateStr){
  const tx=stockNetTransactions(dateStr);
  let production=0, adjustment=0, damage=0;
  tx.forEach(x=>{
    const q=Number(x.quantity)||0;
    if(x.type==='production') production+=q;
    else if(x.type==='adjustment') adjustment+=q;
    else if(x.type==='damage') damage+=q;
  });
  const dispatch=employeesData.reduce((sum,e)=>sum+(Number(e.bagsLoaded)||0),0);
  const returns=employeesData.reduce((sum,e)=>sum+(Number(e.bagsReturned)||0),0);
  return {production,adjustment,damage,dispatch,returns};
}
function stockBalance(dateStr){
  const tx=stockNetTransactions(dateStr);
  const opening=tx.filter(x=>x.type==='opening').reduce((a,x)=>a+(Number(x.quantity)||0),0);
  const m=stockMovementForDate(dateStr);
  return opening+m.production+m.adjustment-m.damage-m.dispatch+m.returns;
}

    ${m.dispatch?`<div class="workspace-row"><div class="main"><div class="title">Truck dispatch · ${m.dispatch.toLocaleString()} bags</div><div class="meta">Based on employee loads</div></div><span class="status-pill pending">Out</span></div>`:''}

function routeById(id){return routesData.find(r=>r.id===id)||null;}
function saleAreaLabel(s){const r=s.routeId?routeById(s.routeId):null;return r?(r.name+(r.area?' · '+r.area:'')):(s.area||'');}
function tripForToday(){return tripsData.filter(t=>t.date===currentDate);}
function myTrips(){const id=getSavedEmployeeId();return tripForToday().filter(t=>slugify(t.employeeName||'')===id);}
function tripSales(trip){return salesData.filter(s=>s.tripId===trip.id);}
function routeStats(routeId){
  const trips=tripsData.filter(t=>t.routeId===routeId);
  const ids=new Set(trips.map(t=>t.id));
  const sales=salesData.filter(s=>ids.has(s.tripId));
  return {trips:trips.length,bags:sales.reduce((a,s)=>a+(s.bags||0),0),revenue:sales.reduce((a,s)=>a+(s.amount||0),0),customers:new Set(sales.map(s=>s.customerId).filter(Boolean)).size};
}

  const active=visible.filter(t=>t.status==='active');
  let html=`<div class="workspace-head"><div><h2>Trips</h2><div class="subline">Truck loading, routes, sales, returns and reconciliation · ${fmtDateLabel(currentDate)}</div></div><span class="status-pill">${active.length} active</span></div>`;
  const current=role==='employee'?(mine.find(t=>t.status==='active')||null):null;

function wireAccountsModule(){
  const createBtn=document.getElementById('accCreateBtn');
  if(createBtn) createBtn.onclick=async()=>{
    if(!db){ showToast("No connection — try again."); return; }
    const name=(document.getElementById('accName').value||'').trim();
    const uname=(document.getElementById('accUser').value||'').trim().toLowerCase();
    const pin=(document.getElementById('accPin').value||'').trim();
    const role=document.getElementById('accRole').value;
    if(!name){ showToast("Enter the person's full name."); return; }
    if(!/^[a-z0-9_.-]{3,}$/.test(uname)){ showToast("Username: at least 3 letters/numbers, no spaces."); return; }
    if(pin.length<4){ showToast("PIN must be at least 4 digits."); return; }
    if(usersCache.some(u=>u.username===uname)){ showToast("That username is already taken."); return; }
    createBtn.disabled=true;
    try{
      const hash=await pinHash(uname,pin);
      await db.doc("users/"+uname).set({id:uname,username:uname,name:name,pinHash:hash,role:role,active:true,createdAt:Date.now(),createdBy:currentUser?currentUser.name:"owner"});
      if(role==='employee') await db.doc("roster/"+slugify(name)).set({name:name,role:"employee",active:true,createdAt:Date.now()});
      showToast("Account created for "+name);
      document.getElementById('accName').value='';document.getElementById('accUser').value='';document.getElementById('accPin').value='';
    }catch(e){ console.error(e); showToast(describeDbError(e)); }
    createBtn.disabled=false;
  };
  document.querySelectorAll('[data-acc-toggle]').forEach(btn=>{
    btn.onclick=async()=>{
      if(!db) return;
      const id=btn.getAttribute('data-acc-toggle');
      const next=btn.getAttribute('data-acc-active')!=='1';
      try{ await db.doc("users/"+id).update({active:next}); showToast(next?"Account activated":"Account deactivated"); }
      catch(e){ console.error(e); showToast(describeDbError(e)); }
    };
  });
  document.querySelectorAll('[data-acc-delete]').forEach(btn=>{
    btn.onclick=async()=>{
      if(!db) return;
      const id=btn.getAttribute('data-acc-delete');
      const u=(usersCache||[]).find(x=>x.id===id)||{};

      try{ await db.doc("users/"+id).delete(); showToast("Account deleted: @"+(u.username||id)); }
      catch(e){ console.error(e); showToast(describeDbError(e)); }
    };
  });
}

    el.querySelectorAll('[data-ws-pay]').forEach(x=>x.classList.toggle('sel',x===b));
  }));
  const log=el.querySelector('#wsLogSale'); if(log) log.addEventListener('click',async()=>{
    const bags=parseFloat(el.querySelector('#wsSaleBags').value); const price=parseFloat(el.querySelector('#wsSalePrice').value); const pay=el.querySelector('#wsSalePay').value; const custName=el.querySelector('#wsSaleCustomer').value.trim(); const creditNote=el.querySelector('#wsCreditNote')?.value.trim()||''; const free=parseFloat(el.querySelector('#wsSaleFree').value)||0; const damaged=parseFloat(el.querySelector('#wsSaleDamaged').value)||0;
    const empId=getSavedEmployeeId(); const emp=rosterData.find(x=>x.id===empId)||getEmployeeList().find(x=>x.id===empId); if(!emp){showToast('Select your name at the top of this screen first');return;}
    if(!bags||bags<=0||!price||!pay){showToast('Complete bags, price and payment');return;}
    let customer=customersData.find(c=>(c.name||'').toLowerCase()===custName.toLowerCase());
    if(pay==='credit'&&!customer){showToast('Select an existing customer or add the customer first');return;}
    if(!db){showToast('No live sync in this preview');return;}
    const amount=bags*price; const activeTrip=myTrips().find(t=>t.status==='active'); const record={bags,pricePerBag:price,amount,paymentType:pay,customerName:custName||null,customerId:customer?.id||null,freeBags:free,damagedBags:damaged,employeeName:emp.name,tripId:activeTrip?.id||null,routeId:activeTrip?.routeId||null,area:activeTrip?.area||null,ts:Date.now()};
    if(!confirm(`Log this sale?\n\n${bags} bags × ${money(price)} = ${money(amount)} · ${pay==='cash'?'Cash':pay==='momo'?'MoMo':'Credit'}${custName?' · '+custName:''}${free?' · +'+free+' free':''}${damaged?' · '+damaged+' damaged':''}`)) return;
    try{
      const added=await db.collection(`days/${currentDate}/sales`).add(record);
      let creditAdded=null;
      if(pay==='credit') creditAdded=await db.collection('creditTransactions').add({customerId:customer.id,employeeName:emp.name,date:currentDate,bags,pricePerBag:price,amount,status:'pending',explanation:creditNote,sourceSaleId:added.id,ts:Date.now()});
      showUndoToast(pay==='credit'?'Sale logged — credit pending manager review':'Sale logged', async()=>{
        try{ await db.doc(`days/${currentDate}/sales/${added.id}`).delete(); if(creditAdded) await db.doc(`creditTransactions/${creditAdded.id}`).delete(); showToast('Sale undone'); }
        catch(err){ showToast(describeDbError(err)); }
      });
      renderWorkspace();
    }catch(e){showToast(describeDbError(e));}
  });
  el.querySelectorAll('[data-credit-approve]').forEach(b=>b.addEventListener('click',async()=>{if(!db)return;try{const credit=creditData.find(x=>x.id===b.dataset.creditApprove); await db.doc(`creditTransactions/${b.dataset.creditApprove}`).update({status:'approved',reviewedBy:currentRole(),reviewedAt:Date.now()}); if(credit?.customerId){const c=customersData.find(x=>x.id===credit.customerId); if(c?.status==='pending') await db.doc(`customers/${credit.customerId}`).update({status:'active',approvedBy:currentRole(),approvedAt:Date.now()});} showToast('Credit approved');}catch(e){showToast(describeDbError(e));}}));
  el.querySelectorAll('[data-credit-reject]').forEach(b=>b.addEventListener('click',async()=>{if(!db)return;const note=prompt('Reason for rejection (optional):')||'';try{await db.doc(`creditTransactions/${b.dataset.creditReject}`).update({status:'rejected',reviewedBy:currentRole(),reviewedAt:Date.now(),explanation:note});showToast('Credit rejected');}catch(e){showToast(describeDbError(e));}}));
  const payBtn=el.querySelector('#recordPaymentBtn'); if(payBtn) payBtn.addEventListener('click',async()=>{const customerId=el.querySelector('#paymentCustomer').value;const amount=parseFloat(el.querySelector('#paymentAmount').value);if(!customerId||!amount||amount<=0){showToast('Select customer and enter payment');return;}if(!db){showToast('No live sync in this preview');return;}const method=el.querySelector('#paymentMethod').value;const payCust=customersData.find(c=>c.id===customerId);if(!confirm(`Record payment of ${money(amount)} (${method==='momo'?'MoMo':'Cash'}) from ${payCust?payCust.name:'this customer'}?`)) return;try{await db.collection('customerPayments').add({type:'payment',customerId,amount,method,note:el.querySelector('#paymentNote').value.trim(),receivedBy:currentRole(),receivedByName:(currentUser&&currentUser.name)||currentRole(),status:'approved',ts:Date.now()});showToast('Payment recorded');}catch(e){showToast(describeDbError(e));}});
  el.querySelectorAll('[data-customer-payment]').forEach(b=>b.addEventListener('click',()=>{activeNav='credit';document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav==='credit'));renderWorkspace();const sel=document.getElementById('paymentCustomer');if(sel)sel.value=b.dataset.customerPayment;}));
  el.querySelectorAll('[data-credit-settle]').forEach(b=>b.addEventListener('click',async()=>{
    if(!db||!canManageCredit())return;
    const cust=customersData.find(x=>x.id===b.dataset.creditSettle); if(!cust)return;
    const bal=customerBalance(cust.id); if(bal<=0){showToast('No balance to settle');return;}
    if(!confirm(`Record FULL payment of ${money(bal)} from ${cust.name} as CASH?\n\nThis clears their balance and removes them from the owing list.\nFor MoMo or a partial amount, use "Record customer payment" below instead.`))return;
    try{await db.collection('customerPayments').add({type:'payment',customerId:cust.id,amount:bal,method:'cash',note:'Full settlement',receivedBy:currentRole(),receivedByName:(currentUser&&currentUser.name)||currentRole(),status:'approved',ts:Date.now()});showToast('Balance settled: '+cust.name);}catch(e){showToast(describeDbError(e));}
  }));
}


function wireOperationsModules(){
  const el=document.getElementById('view-workspace');
  if(!el) return;
  const stockBtn=el.querySelector('#stockAddBtn');
  if(stockBtn) stockBtn.addEventListener('click',async()=>{
    const type=el.querySelector('#stockType').value;
    const quantity=parseFloat(el.querySelector('#stockQty').value);
    const note=el.querySelector('#stockNote').value.trim();
    if(!quantity||quantity<=0){showToast('Enter a valid number of bags');return;}
    if(!db){showToast('No live sync in this preview');return;}
    try{await db.collection('stockTransactions').add({type,quantity,date:currentDate,note,recordedBy:currentRole(),ts:Date.now()});showToast('Stock movement saved');}
    catch(e){showToast(describeDbError(e));}
  });
  const exportBtn=el.querySelector('#exportReportBtn');
  if(exportBtn) exportBtn.addEventListener('click',()=>{
    const sales=currentRole()==='employee'?salesData.filter(s=>slugify(s.employeeName||'')===getSavedEmployeeId()):salesData;
    const rows=[['Date','Employee','Bags','Amount','Payment','Customer']];
    sales.forEach(s=>rows.push([currentDate,s.employeeName||'',s.bags||0,(s.amount||0).toFixed(2),s.paymentType||'',s.customerName||'']));
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`vintage-cool-report-${currentDate}.csv`; a.click(); URL.revokeObjectURL(url);
  });
}
function renderAll(){
  preserveThenRender("view-dashboard", renderDashboard);
  preserveThenRender("view-employee", renderEmployee);
  preserveThenRender("view-manager", renderManager);
  preserveThenRender("view-cousin", renderCousin);
  renderWorkspace();
  applyActiveWorkspace();
}

// Live updates can arrive mid-typing (e.g. the moment the page opens, or
// another employee logging a sale). Redrawing the whole view would wipe
// whatever the person is currently typing. This captures every input's
// value and focus/cursor position first, redraws, then puts it all back.
function preserveThenRender(containerId, renderFn){
  const container = document.getElementById(containerId);
  const values = {};
  let focusedId = null, selStart = null, selEnd = null;
  container.querySelectorAll("input[id], select[id]").forEach(inp=>{
    values[inp.id] = inp.value;
    if(document.activeElement === inp){
      focusedId = inp.id;
      try{ selStart = inp.selectionStart; selEnd = inp.selectionEnd; }catch(e){}
    }
  });

  renderFn();

  Object.keys(values).forEach(id=>{
    const el = container.querySelector("#"+CSS.escape(id));
    if(el) el.value = values[id];
  });
  if(focusedId){
    const el = container.querySelector("#"+CSS.escape(focusedId));
    if(el){
      el.focus();
      if(selStart!=null){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  if(containerId==="view-employee"){
    if(employeeSelPrice!=null){
      const b = container.querySelector(`#priceBtns button[data-p="${employeeSelPrice}"]`);
      if(b) b.classList.add("sel");
    }
    if(employeeSelPay!=null){
      const b = container.querySelector(`#payBtns button[data-pay="${employeeSelPay}"]`);
      if(b) b.classList.add("sel");
    }
  }
}

// ---------- AUTH (login, session, role chrome) ----------
const AUTH_KEY="vc_session_v1";
let currentUser=null, ownerPreview=null, usersCache=[];

function getSession(){ try{ const s=JSON.parse(localStorage.getItem(AUTH_KEY)||"null"); return (s&&s.username&&s.role)?s:null; }catch(e){ return null; } }
function setSession(s){ if(s) localStorage.setItem(AUTH_KEY,JSON.stringify(s)); else localStorage.removeItem(AUTH_KEY); }
async function sha256Hex(text){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function pinHash(username,pin){ return sha256Hex("vintagecool:"+String(username).trim().toLowerCase()+":"+pin); }

function fetchUsersOnce(){
  return new Promise(resolve=>{
    if(!db){ resolve(usersCache); return; }
    let done=false; let unsub=null;
    const finish=v=>{ if(done) return; done=true; try{ if(unsub) unsub(); }catch(e){} resolve(v); };
    const timer=setTimeout(()=>finish(usersCache),9000);
    try{
      unsub=db.collection("users").limit(500).onSnapshot(snap=>{
        usersCache=snap.docs.map(d=>({id:d.id,...d.data()}));
        clearTimeout(timer); finish(usersCache);
      }, err=>{ console.error(err); clearTimeout(timer); finish(usersCache); });
    }catch(e){ clearTimeout(timer); finish(usersCache); }
  });
}

async function bindEmployeeIdentity(){
  if(!currentUser||currentUser.role!=="employee"||!db) return;
  const slug=slugify(currentUser.name||"");
  const deadline=Date.now()+6000;
  while(Date.now()<deadline){
    const rec=rosterData.find(e=>e.id===slug);
    if(rec){ saveEmployeeId(rec.id); return; }
    if(rosterData.length) break;
    await new Promise(r=>setTimeout(r,400));
  }
  try{
    await db.doc("roster/"+slug).set({name:currentUser.name,role:"employee",active:true,createdAt:Date.now()});
    saveEmployeeId(slug);
  }catch(e){ console.error(e); }
}

function applyRoleChrome(){
  const chip=document.getElementById("userChip");
  if(chip) chip.textContent=currentUser?(currentUser.name+" · "+roleLabel(currentUser.role)):"—";
  document.body.classList.toggle("is-owner", !!(currentUser&&currentUser.role==="cousin"));
  document.body.classList.toggle("is-manager", !!(currentUser&&currentUser.role==="manager"));
  document.body.classList.toggle("is-employee", !!(currentUser&&currentUser.role==="employee"));
  if(currentUser&&currentUser.role==="cousin"){
    if(!ownerPreview) ownerPreview="cousin";
    document.querySelectorAll(".role-btn[data-role]").forEach(b=>b.classList.toggle("active",b.dataset.role===ownerPreview));
  }
  syncViewRole();
}
function syncViewRole(){
  const eff=currentRole();
  document.body.classList.toggle("view-employee", eff==="employee");
  document.body.classList.toggle("view-manager", eff==="manager");
  document.body.classList.toggle("view-owner", eff==="cousin");
}
function enterApp(){
  const ls=document.getElementById("loginScreen");
  if(ls) ls.classList.add("hidden");
  applyRoleChrome();
  if(currentUser && currentUser.role==="employee"){
    currentDate = todayStr();
    const di=document.getElementById("dateInput");
    if(di) di.value = currentDate;
    subscribeDay(currentDate);
    if(activeNav==="dashboard"||['routes','employees','reports'].includes(activeNav)) activeNav="trips";
    document.querySelectorAll('[data-nav]').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav===activeNav));
  }
  renderDashboard();
  applyActiveWorkspace();
  if(activeNav!=="dashboard") renderWorkspace();
}
function showLogin(){
  const ls=document.getElementById("loginScreen");
  if(ls) ls.classList.remove("hidden");
  const u=document.getElementById("loginUser");
  if(u) setTimeout(()=>u.focus(),150);
}
async function doLogin(){
  const errEl=document.getElementById("loginError");
  const btn=document.getElementById("loginBtn");
  const uname=(document.getElementById("loginUser").value||"").trim().toLowerCase();
  const pin=(document.getElementById("loginPin").value||"").trim();
  errEl.textContent="";
  if(!uname||!pin){ errEl.textContent="Enter your username and PIN."; return; }
  btn.disabled=true; btn.textContent="Signing in…";
  try{
    const users=await fetchUsersOnce();
    const found=users.find(u=>String(u.username||"").toLowerCase()===uname);
    const hash=await pinHash(uname,pin);
    if(!found||found.pinHash!==hash){ errEl.textContent="Wrong username or PIN."; return; }
    if(found.active===false){ errEl.textContent="This account is deactivated. Contact the owner."; return; }
    currentUser={username:found.username,name:found.name||found.username,role:found.role||"employee"};
    setSession(currentUser);
    ownerPreview=null;
    await bindEmployeeIdentity();
    enterApp();
    showToast("Welcome, "+currentUser.name);
  }catch(e){ console.error(e); errEl.textContent="Connection problem — try again."; }
  finally{ btn.disabled=false; btn.textContent="Sign in"; }
}
function doLogout(){ setSession(null); location.reload(); }
async function bootAuth(){
  const s=getSession();
  if(s){
    currentUser=s;
    bindEmployeeIdentity();
    enterApp();
    fetchUsersOnce().then(users=>{
      if(!users||!users.length) return; // list didn't load — skip revalidation rather than false-logout
      const still=users.find(u=>String(u.username||"").toLowerCase()===String(s.username).toLowerCase());
      if(!still){ showToast("This account no longer exists."); setTimeout(doLogout,1200); return; }
      if(still.active===false){ showToast("This account was deactivated."); setTimeout(doLogout,1200); return; }
      if(still.name!==s.name||still.role!==s.role){ currentUser={username:still.username,name:still.name||still.username,role:still.role||"employee"}; setSession(currentUser); applyRoleChrome(); renderDashboard(); }
    });
  } else {
    showLogin();
  }
}
document.getElementById("loginBtn").addEventListener("click",doLogin);
["loginUser","loginPin"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); }));
document.getElementById("logoutBtn").addEventListener("click",doLogout);

initDb();
bootAuth();

/* ---------- PWA: service worker + install prompt ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
let deferredInstallPrompt=null;
function syncInstallButtons(){
  const show=!!deferredInstallPrompt || /iphone|ipad|ipod/i.test(navigator.userAgent);
  ["installBtn","installBtnLogin"].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display=show?"":"none"; });
}
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  syncInstallButtons();
});
window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;
  ["installBtn","installBtnLogin"].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display="none"; });
  showToast("VC Ops installed");
});
["installBtn","installBtnLogin"].forEach(id=>{
  const b=document.getElementById(id);
  if(b) b.addEventListener("click",async()=>{
    if(!deferredInstallPrompt){ showToast("On iPhone: Share → Add to Home Screen"); return; }
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    syncInstallButtons();
  });
});
syncInstallButtons();
